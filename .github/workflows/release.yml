name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set version from tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const v = process.env.REF_NAME.replace(/^v/, '');
          const files = [
            'package.json',
            'packages/electron/package.json',
            'packages/renderer/package.json',
            'packages/server/package.json',
            'packages/shared/package.json',
          ];
          for (const f of files) {
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            p.version = v;
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
          }
          NODE

      - name: Build shared
        run: npm run build --workspace @easydb/shared

      - name: Build server
        run: npm run build --workspace @easydb/server

      - name: Build renderer (relative base for file://)
        working-directory: packages/renderer
        run: npx vite build --base ./

      - name: Build electron (tsc)
        run: npm run build --workspace @easydb/electron

      - name: Package & publish to GitHub Release
        working-directory: packages/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple cert configured — skip auto-discovery to avoid CI failure.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --config electron-builder.json --publish always

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.2). No leading "v".'
        required: true
        type: string

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Set version
        shell: bash
        env:
          REF_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const v = process.env.REF_NAME.replace(/^v/, '');
          const files = [
            'package.json',
            'packages/electron/package.json',
            'packages/renderer/package.json',
            'packages/server/package.json',
            'packages/shared/package.json',
          ];
          for (const f of files) {
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            p.version = v;
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
          }
          NODE

      - name: Build shared
        run: npm run build --workspace @easydb/shared

      - name: Build server
        run: npm run build --workspace @easydb/server

      - name: Build renderer for Electron (base=./, outputs to packages/electron/frontend/)
        run: npm run build:electron --workspace @easydb/renderer

      - name: Build electron (tsc)
        run: npm run build --workspace @easydb/electron

      # Defensive: electron-builder's app-builder.exe has been observed missing
      # on GH-hosted Windows runners — Defender quarantining the .exe inside
      # node_modules is the most likely cause. Verify the binary exists; if
      # not, reinstall app-builder-bin. Logs the tree on miss to help diagnose.
      - name: Verify app-builder-bin binary
        shell: bash
        run: |
          set -e
          case "${RUNNER_OS}" in
            Windows) rel="win/x64/app-builder.exe" ;;
            macOS)   rel="mac/app-builder_$(node -p 'process.arch === "arm64" ? "arm64" : "amd64"')" ;;
            *)       rel="linux/$(node -p 'process.arch')/app-builder" ;;
          esac
          path="node_modules/app-builder-bin/$rel"
          echo "== expecting app-builder at: $path"
          if [ ! -f "$path" ]; then
            echo "== MISSING — listing app-builder-bin tree:"
            ls -R node_modules/app-builder-bin/ 2>&1 | head -80 || true
            echo "== reinstalling app-builder-bin"
            npm install --no-save --no-package-lock app-builder-bin
            ls -la "node_modules/app-builder-bin/$(dirname "$rel")/" || { echo "still missing after reinstall"; exit 1; }
          else
            echo "== present"
          fi

      - name: Package & publish to GitHub Release
        working-directory: packages/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple cert configured — skip auto-discovery to avoid CI failure.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --config electron-builder.json --publish always

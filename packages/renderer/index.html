<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default every hyperlink to a new tab (view templates, cell links, etc.).
         `target` only — no `href` — so relative URL / module resolution is
         unaffected. Modern browsers imply rel=noopener for target=_blank. -->
    <base target="_blank" />
    <!-- `href` is relative so it resolves against the deploy base (the app also
         ships under a GitHub Pages subpath, where a leading "/" would 404). -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- The version is kept in sync by scripts/bump-version.mjs. app-shell
         prefixes the workspace title at runtime, keeping this as the base. -->
    <title>easyDBAccess v0.0.244</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      /*
       * Light-DOM container that panel-shell windows mount into. Fixed
       * between the app-shell's header and footer (their heights are pinned
       * by their own CSS: ~48px each), with overflow hidden. Panels drag
       * freely with no containment — they may extend past this region or
       * off-screen; the pan/zoom canvas (touch pan / desktop right-drag)
       * brings them back. The chrome keeps a higher z-index so panels never
       * cover it.
       */
      #easydb-panels {
        position: fixed;
        top: 48px;
        bottom: 48px;
        left: 0;
        right: 0;
        overflow: hidden;
        pointer-events: none;
      }
      /* Inner viewport that pan/zoom transforms. Panel-shell windows mount
         here; it fills the overlay, so panel geometry stays in the same
         layout coordinates the panel shell already uses (transform is
         purely visual). */
      #easydb-panels-viewport {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
        pointer-events: none;
        z-index: 2; /* above the minimized dock (z-index:1) so windows float over it */
      }
      /* Panels need clicks; the transparent viewport itself does not. */
      #easydb-panels-viewport > .jsPanel {
        pointer-events: auto;
      }
      /* Kind icon (window-mgr/table-kind.ts) in the panel shell's `headerLogo`
         slot, left of the title (class name kept from the old jsPanel API for
         CSS/e2e compatibility — see panel-shell.ts). The slot has no default
         sizing of its own. */
      .jsPanel-headerlogo {
        display: flex;
        align-items: center;
        padding-left: 8px;
      }
      .jsPanel-headerlogo svg {
        display: block;
      }
      /* Refreshable tables (source- or origin-backed: connected / referenced /
         imported) get a distinct header colour so they read as "backed by
         something remote" at a glance — every kind except a plain local table
         (the default panel colour, #01579b) and view windows (cyan, see
         view-window-manager.ts). The panel shell sets its header colour as an
         INLINE `--eda-panel-color` custom property (createPanel() in
         panel-shell.ts), so `!important` is required to win here; that's
         deliberate — this overrides via a class instead of touching the
         `color` option passed to `createPanel()` in jspanel-manager.ts.
         Violet (#6d28d9) keeps the existing white header text at ~7.1:1
         contrast, matching the default colour's own ~7.4:1. */
      #easydb-panels-viewport > .jsPanel.eda-refreshable,
      #easydb-panels-viewport > .jsPanel.eda-refreshable > .jsPanel-hdr {
        background-color: #6d28d9 !important;
      }
      /* Minimized-window dock. It lives OUTSIDE the pan/zoom viewport (a child
         of the fixed overlay), so minimized windows stay pinned to the bottom-
         left of the table area and do NOT move when the canvas is panned or
         zoomed. It sits below the viewport (z-index:1 < 2) so active windows
         float above it — but shows through the viewport's empty space. The dock
         is click-through; only the minimized bars inside it take pointer events. */
      #easydb-minimized-dock {
        position: absolute;
        left: 0;
        bottom: 0;
        z-index: 1;
        max-width: 100%;
        display: flex;
        flex-wrap: wrap-reverse;
        align-content: flex-end;
        gap: 4px;
        padding: 4px;
        pointer-events: none;
      }
      #easydb-minimized-dock > .jsPanel-replacement {
        pointer-events: auto;
        position: static;
        margin: 0;
      }
      /* On touch devices the overlay itself becomes pointer-interactive so it
         can catch pan/zoom gestures on the empty canvas background. On desktop
         it stays click-through (pointer-events:none) — unchanged behaviour. */
      @media (pointer: coarse) {
        #easydb-panels {
          pointer-events: auto;
        }
      }
    </style>
  </head>
  <body>
    <app-shell></app-shell>
    <div id="easydb-panels">
      <div id="easydb-panels-viewport"></div>
      <div id="easydb-minimized-dock"></div>
    </div>
    <filter-popover></filter-popover>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
